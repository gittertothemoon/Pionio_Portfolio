  <!-- Disable the browser's automatic scroll restoration BEFORE any other
       script can run; otherwise a refresh jumps to the section the user
       last scrolled to. React's ScrollToTop component handles deep links
       via the URL hash itself. -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    function pionioForceTop() {
      if (!location.hash) {
        try { window.scrollTo(0, 0); } catch (e) {}
      }
    }
    document.addEventListener('DOMContentLoaded', pionioForceTop);
    window.addEventListener('load', pionioForceTop);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) pionioForceTop();
    });
  </script>
