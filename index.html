<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Disable the browser's automatic scroll restoration BEFORE any other
       script can run; otherwise a refresh jumps to the section the user
       last scrolled to. React's ScrollToTop component handles deep links
       via the URL hash itself. -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    function pionioForceTop() {
      if (!location.hash) {
        try { window.scrollTo(0, 0); } catch (e) {}
      }
    }
    document.addEventListener('DOMContentLoaded', pionioForceTop);
    window.addEventListener('load', pionioForceTop);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) pionioForceTop();
    });
  </script>

  <!-- Primary Meta Tags (per-route title/description injected by router) -->
  <meta name="author" content="Ivan Panto" />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
  <meta name="googlebot" content="index, follow" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Canonical & Alternates injected per-route by router -->

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="mask-icon" href="/logo.svg" color="#09090b" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="PIONIO" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PIONIO" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Open Graph / Facebook — INVARIANTS ONLY. og:type/url/title/description are
       injected per-route by each page's <Head> (vite-react-ssg); it does NOT
       de-dupe against static tags, so keeping variants here would ship duplicate,
       stale-homepage values on every subpage. -->
  <meta property="og:site_name" content="PIONIO" />
  <meta property="og:image" content="https://pionio.it/og-image-v2.png" />
  <meta property="og:image:secure_url" content="https://pionio.it/og-image-v2.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Pionio · Web Design Studio" />
  <meta property="og:locale" content="it_IT" />

  <!-- Twitter / X — INVARIANTS ONLY (per-route title/url/description via <Head>). -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:image" content="https://pionio.it/og-image-v2.png" />
  <meta name="twitter:image:alt" content="Pionio · Web Design Studio" />
  <meta name="twitter:creator" content="@pionio_dev" />
  <meta name="twitter:site" content="@pionio_dev" />

  <!-- Performance: Preconnect / DNS-prefetch -->
  <link rel="dns-prefetch" href="https://images.unsplash.com" />

  <!-- Self-hosted fonts (Geist + Geist Mono, WOFF2). Preload the two
       critical weights to unblock LCP. Other weights load on demand
       via @font-face in app CSS. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Regular.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/GeistMono-Regular.woff2" crossorigin />
