<!doctype html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <!-- Disable the browser's automatic scroll restoration BEFORE any other
       script can run; otherwise a refresh jumps to the section the user
       last scrolled to. React's ScrollToTop component handles deep links
       via the URL hash itself. -->
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
    }
    function pionioForceTop() {
      if (!location.hash) {
        try { window.scrollTo(0, 0); } catch (e) {}
      }
    }
    document.addEventListener('DOMContentLoaded', pionioForceTop);
    window.addEventListener('load', pionioForceTop);
    window.addEventListener('pageshow', function (e) {
      if (e.persisted) pionioForceTop();
    });
  </script>

  <!-- Title, description, robots, canonical, hreflang, Open Graph and structured data come from each page
       (src/components/Seo.tsx and SiteGraph.tsx): vite-react-ssg doesn't de-duplicate against this template. -->
  <meta name="author" content="Ivan Pantò" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />

  <!-- Icons -->
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="mask-icon" href="/mask-icon.svg" color="#306b4d" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!-- Theme & PWA -->
  <meta name="theme-color" content="#09090b" />
  <meta name="color-scheme" content="dark" />
  <meta name="application-name" content="Pionio" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pionio" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- Self-hosted fonts (Geist + Geist Mono, WOFF2). Preload the two
       critical weights to unblock LCP. Other weights load on demand
       via @font-face in app CSS. -->
  <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Regular.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/GeistMono-Regular.woff2" crossorigin />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
